<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Mission 🎂</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #fff4e6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .card {
    background: white;
    padding: 35px;
    border-radius: 20px;
    text-align: center;
    width: 420px;
    max-width: 85%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  }

  h1 {
    margin-top: 0;
  }

  button {
    border: none;
    padding: 12px 20px;
    margin: 10px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  #birthday {
    background: #ff5c8a;
    color: white;
  }

  #work {
    background: #333;
    color: white;
    position: relative;
  }

  #message {
    margin-top: 20px;
    font-size: 18px;
  }

  .big {
    font-size: 45px;
  }
</style>
</head>

<body>

<div class="card">

  <div id="start">

    <h1>Important Question 🚨</h1>

    <p>
      It's your birthday today.<br>
      What would you like to do?
    </p>

    <button id="birthday">Celebrate 🎂</button>
    <button id="work">Work 💻</button>

    <p id="message"></p>

  </div>

  <div id="final" style="display:none;">

    <div class="big">🎉🎂🥳</div>

    <h1>Correct answer!</h1>

    <p>
      Happy Birthday! 🎈
    </p>

    <p>
      May your meetings be short,<br>
      your coffee be strong,<br>
      and your inbox be suspiciously quiet today.
    </p>

    <p><b>Enjoy your day!</b></p>

  </div>

</div>


<script>

const birthday = document.getElementById("birthday");
const work = document.getElementById("work");
const message = document.getElementById("message");

let attempts = 0;

work.addEventListener("click", function() {

  attempts++;

  const messages = [
    "Work? On your birthday? 🤨",
    "Please reconsider your priorities.",
    "HR has rejected this decision.",
    "Your colleagues strongly disagree.",
    "Okay... the Work button is leaving."
  ];

  message.textContent =
    messages[Math.min(attempts - 1, messages.length - 1)];

  // Move the work button
  work.style.position = "absolute";
  work.style.left = Math.random() * 70 + "%";
  work.style.top = Math.random() * 70 + "%";

});


birthday.addEventListener("click", function() {

  document.getElementById("start").style.display = "none";
  document.getElementById("final").style.display = "block";

});

</script>

</body>
</html>
